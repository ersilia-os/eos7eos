Status: In progress
Title: SynFrag Synthetic Accessibility
Description: Scores how easy a molecule is to synthesize from its SMILES alone. 
  SynFrag pretrains an AttentiveFP graph network on 9.18 million unlabelled 
  molecules by rebuilding them fragment by fragment, then finetunes it on 
  800,000 molecules labelled easy or hard to make by the Retro* planner. The 
  authors benchmarked it on public sets, clinical drugs and AI-generated 
  molecules. Scores are not calibrated probabilities, and molecules without 
  bonds return no value.
